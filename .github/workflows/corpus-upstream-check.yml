name: Corpus Upstream Check

# Drift check against masslegalhelp.org. It observes and reports only: it
# downloads no PDF, and it must never attempt to defeat, solve, or evade the
# upstream bot check. A challenged page is reported as blocked and left to a
# human.
#
# A crawl cannot get past MassLegalHelp's bot check (scripts/check-corpus-upstream.js
# --help says why), so the check itself runs on pages read in a browser, with
# --capture. Until 2026-11-09 this workflow crawled every Monday and could only
# file the same inconclusive report while the run showed green. Now:
#   - on the 1st of each month it reads nothing upstream and asks the committed
#     upstream_state.json whether a check has confirmed the corpus in the last
#     40 days; if not, it files a reminder and the run goes red;
#   - dispatched with no input it crawls, to see whether a crawl gets through
#     again, for instance after MassLegalHelp lets the checker in;
#   - dispatched with overdue_after_days it runs the monthly due check.
#
# The corpus is committed in this repository at
# resources/rag-corpus/mass tenant rights, so a single checkout is enough and
# RAG_CORPUS_ROOT is left unset: resolveCorpusRoot() finds the in-repo copy.
#
# scripts/check-corpus-upstream.js exit codes drive everything below:
#   0  every row still has a PDF linked on its index page whose decoded file
#      name matches the recorded revision -> stay quiet. Narrower than "the
#      corpus is current": only revision strings are compared, so a same-name
#      re-upload and a newly published document both pass as 0. See the
#      script's --help.
#   3  upstream changed                                           -> file an issue
#   4  ran but could not confirm every row (blocked page, or a row with no
#      candidate) -> file an issue, framed as inconclusive, and fail the job
#   5  the due check found no recent confirmed check -> file a reminder, and
#      fail the job
#   1  the tool itself failed                                     -> fail the job
# 4 and 5 file an issue for the same reason 4 exists: a run that observed
# nothing must never pass for a clean one. They fail the job for that reason
# too: a green run is read as "checked, all fine".

on:
  schedule:
    - cron: "0 13 1 * *"
  workflow_dispatch:
    inputs:
      overdue_after_days:
        description: "Leave empty to crawl. A number of days runs the monthly due check instead."
        required: false
        default: ""

permissions:
  contents: read
  issues: write

# Two dispatches at once would otherwise both find no open issue and each
# create one.
concurrency:
  group: corpus-upstream-check
  cancel-in-progress: false

jobs:
  check:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26.04 on
    # 2026-10-19. Bump deliberately, after checking that
    # `playwright install --with-deps` and the service containers still come up.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPORT_PATH: artifacts/corpus-upstream.json
      UPSTREAM_ISSUE_LABEL: corpus-upstream
      # The checker validates it; it reaches the shell only as a quoted variable.
      OVERDUE_AFTER_DAYS: ${{ github.event_name == 'schedule' && '40' || inputs.overdue_after_days }}
    steps:
      - name: Check out server and corpus
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: env.OVERDUE_AFTER_DAYS == ''
        run: npx playwright install --with-deps chromium

      - name: Check upstream
        id: check
        shell: bash
        run: |
          set +e
          if [ -n "$OVERDUE_AFTER_DAYS" ]; then
            node scripts/check-corpus-upstream.js --overdue-after-days="$OVERDUE_AFTER_DAYS" --report="$REPORT_PATH"
          else
            node scripts/check-corpus-upstream.js --report="$REPORT_PATH"
          fi
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0)
              echo "Every manifest row still matches the revision the manifest records."
              echo "This does not prove the corpus is current: only revision strings are"
              echo "compared, so a same-name re-upload or a newly published document would"
              echo "also exit 0. See scripts/check-corpus-upstream.js --help."
              ;;
            3)
              echo "::warning::MassLegalHelp published changes; opening or updating the corpus issue."
              ;;
            4)
              echo "::warning::The check could not confirm every row; opening or updating the corpus issue as inconclusive."
              ;;
            5)
              echo "::warning::No check has confirmed the corpus within $OVERDUE_AFTER_DAYS days; commenting on the corpus issue."
              ;;
            *)
              echo "::error::check-corpus-upstream.js failed with exit $status. No conclusion was reached about the corpus." >&2
              exit 1
              ;;
          esac

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: corpus-upstream-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: warn

      # 3, 4 and 5 each file an issue; the body and title differ. Scraped strings
      # reach gh only through --body-file, never through a shell word.
      - name: Open or update the corpus upstream issue
        if: steps.check.outputs.status == '3' || steps.check.outputs.status == '4' || steps.check.outputs.status == '5'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ steps.check.outputs.status }}
          BODY_FILE: ${{ runner.temp }}/corpus-upstream-issue.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/format-upstream-issue.js \
            --report="$REPORT_PATH" \
            --status="$STATUS" \
            --run-url="$RUN_URL" > "$BODY_FILE"

          # A redirect captures an empty stdout just as happily as a full one,
          # and gh would file the blank issue without complaint. Fail here
          # instead: a corpus alert nobody can read is worse than a red run.
          test -s "$BODY_FILE"

          # The one string gh cannot take from a file. The formatter builds it
          # from fixed text plus a date it matched against \d{4}-\d{2}-\d{2}, so
          # no scraped byte reaches this command substitution.
          title="$(node scripts/format-upstream-issue.js --report="$REPORT_PATH" --status="$STATUS" --title)"
          test -n "$title"

          existing="$(gh issue list --label "$UPSTREAM_ISSUE_LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            # A runner that stays blocked reports the same thing on every run.
            # Identical comments bury the one run that finds real drift, so
            # an exact repeat of the last report is dropped. Only status 4 is
            # eligible: published drift is news every single time it is seen.
            # The comparison ignores the two lines that always move, and runs
            # over files so no scraped byte reaches a shell word.
            #
            # It compares against this workflow's own last report rather than
            # the last comment of any kind. Comparing against the newest comment
            # meant one human reply -- someone recording what they checked by
            # hand -- made the next run look like news and mail everyone again.
            if [ "$STATUS" = "4" ]; then
              previous="$RUNNER_TEMP/corpus-upstream-previous.md"
              gh issue view "$existing" --json body,comments \
                --jq '([.comments[] | select(.author.login | test("^github-actions"))] | last | .body) // .body // ""' > "$previous" \
                || : > "$previous"
              # The comparison itself is unit tested in upstreamIssue.test.js.
              # A hand-rolled diff here twice missed a repeat, most recently
              # because the fetched copy carries one more trailing newline than
              # the file the formatter writes.
              if node scripts/is-same-upstream-report.js "$previous" "$BODY_FILE"; then
                echo "::notice::#$existing already carries this exact inconclusive report; not posting a duplicate."
                exit 0
              fi
            fi
            echo "Commenting on existing issue #$existing"
            gh issue comment "$existing" --body-file "$BODY_FILE"
          else
            # The label already exists from the second issue onwards, and that
            # failure is the expected one. Any other failure surfaces loudly on
            # the gh issue create below, which cannot run without the label.
            gh label create "$UPSTREAM_ISSUE_LABEL" \
              --description "MassLegalHelp corpus drift" \
              --color FBCA04 2>/dev/null || true
            gh issue create \
              --title "$title" \
              --label "$UPSTREAM_ISSUE_LABEL" \
              --body-file "$BODY_FILE"
          fi

      - name: Fail when nothing was confirmed
        if: steps.check.outputs.status == '4' || steps.check.outputs.status == '5'
        run: |
          echo "::error::Exit ${{ steps.check.outputs.status }}: this run confirmed nothing about the corpus. The corpus-upstream issue says what to do."
          exit 1
