name: Live RAG Evaluation

on:
  workflow_dispatch:
    inputs:
      knowledge_collection:
        description: >-
          Milvus knowledge collection to evaluate. Leave blank to use the
          RAG_EVAL_MILVUS_KNOWLEDGE_COLLECTION secret, which names the live
          alias. Set it to a corpus-ingest staging collection
          (leaseqa_knowledge_chunks_<version-prefix>) to judge generation
          quality before the alias is moved.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live-rag-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Resolved once so the pre-flight report and the server it starts cannot
      # disagree. Unlike corpus-ingest this is allowed to be empty: evaluating
      # the live alias is a legitimate, and the most common, use of this
      # workflow, and an empty value lets config.js apply its built-in default.
      RAG_MILVUS_KNOWLEDGE_COLLECTION: ${{ inputs.knowledge_collection || secrets.RAG_EVAL_MILVUS_KNOWLEDGE_COLLECTION }}
      RAG_EVAL_MIN_PASS_RATE: "0.90"
      RAG_EVAL_MIN_SAFE_RATE: "0.98"
      RAG_EVAL_OUTPUT: artifacts/rag-eval.json
      SERVER_ENV: development
      PORT: "4050"
      CI_DISABLE_RATE_LIMIT: "true"
      GOOGLE_CLIENT_ID: live-eval-placeholder
      GOOGLE_CLIENT_SECRET: live-eval-placeholder
    steps:
      - name: Check out server
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require live evaluation credentials
        shell: bash
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.RAG_EVAL_DATABASE_CONNECTION_STRING }}
          SESSION_SECRET: ${{ secrets.RAG_EVAL_SESSION_SECRET }}
          PROVIDER_API_KEY: ${{ secrets.RAG_EVAL_DASHSCOPE_API_KEY }}
          RAG_MILVUS_ADDRESS: ${{ secrets.RAG_EVAL_MILVUS_ADDRESS }}
        run: |
          test -n "$DATABASE_CONNECTION_STRING"
          test -n "$SESSION_SECRET"
          test -n "$RAG_MILVUS_ADDRESS"
          test -n "$PROVIDER_API_KEY"
          # An eval that does not say which collection it judged cannot be used
          # to clear a staging corpus for activation.
          if [ -n "$RAG_MILVUS_KNOWLEDGE_COLLECTION" ]; then
            echo "Evaluating knowledge collection: $RAG_MILVUS_KNOWLEDGE_COLLECTION"
          else
            echo "::warning::No knowledge_collection input and no" \
              "RAG_EVAL_MILVUS_KNOWLEDGE_COLLECTION secret; the server falls back" \
              "to the built-in leaseqa_knowledge_chunks default."
          fi

      - name: Start local server
        shell: bash
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.RAG_EVAL_DATABASE_CONNECTION_STRING }}
          SESSION_SECRET: ${{ secrets.RAG_EVAL_SESSION_SECRET }}
          DASHSCOPE_API_KEY: ${{ secrets.RAG_EVAL_DASHSCOPE_API_KEY }}
          ARK_API_KEY: ${{ secrets.RAG_EVAL_DASHSCOPE_API_KEY }}
          RAG_MILVUS_ADDRESS: ${{ secrets.RAG_EVAL_MILVUS_ADDRESS }}
          RAG_MILVUS_TOKEN: ${{ secrets.RAG_EVAL_MILVUS_TOKEN }}
          RAG_PROVIDER: ${{ secrets.RAG_EVAL_EMBEDDING_PROVIDER }}
          RAG_CHAT_BASE_URL: ${{ secrets.RAG_EVAL_CHAT_BASE_URL }}
          RAG_EMBEDDING_BASE_URL: ${{ secrets.RAG_EVAL_EMBEDDING_BASE_URL }}
          RAG_CHAT_MODEL: ${{ secrets.RAG_EVAL_CHAT_MODEL }}
          RAG_EMBEDDING_MODEL: ${{ secrets.RAG_EVAL_EMBEDDING_MODEL }}
          RAG_EMBEDDING_DIMENSIONS: ${{ secrets.RAG_EVAL_EMBEDDING_DIMENSIONS }}
          RAG_EMBEDDING_PROVIDER: ${{ secrets.RAG_EVAL_EMBEDDING_PROVIDER }}
        run: |
          npm start > "$RUNNER_TEMP/leaseqa-rag-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/leaseqa-rag-server.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4050/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/leaseqa-rag-server.log"
          exit 1

      - name: Run credentialed live RAG evaluation
        run: node scripts/run-rag-eval.js --base-url=http://127.0.0.1:4050

      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rag-live-eval-${{ github.run_id }}
          path: artifacts/rag-eval.json
          if-no-files-found: warn

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/leaseqa-rag-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/leaseqa-rag-server.pid")" || true
          fi
