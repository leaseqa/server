name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out server
        uses: actions/checkout@v6.0.2
        with:
          path: leaseqa-server

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: leaseqa-server/package-lock.json

      - name: Install dependencies
        working-directory: leaseqa-server
        run: npm ci

      - name: Lint server
        working-directory: leaseqa-server
        run: npm run lint

      - name: Run deterministic RAG contract suite
        working-directory: leaseqa-server
        run: npm run test:rag

      - name: Run server test suite
        working-directory: leaseqa-server
        run: npm test

      - name: Enforce production dependency security gate
        working-directory: leaseqa-server
        run: npm audit --omit=dev --audit-level=high

      - name: Report development dependency advisories
        working-directory: leaseqa-server
        run: npm audit --include=dev --audit-level=high
        continue-on-error: true

  client-e2e:
    runs-on: ubuntu-latest
    needs: server-test
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_CONNECTION_STRING: mongodb://127.0.0.1:27017/leaseqa_ci
      SESSION_SECRET: leaseqa-ci-secret
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      PLAYWRIGHT_ADMIN_PASSWORD: leaseqa-e2e-admin
      CI_SKIP_RAG: "true"
      CI_DISABLE_RATE_LIMIT: "true"
    steps:
      - name: Check out server
        uses: actions/checkout@v6.0.2
        with:
          path: leaseqa-server

      - name: Check out client
        uses: actions/checkout@v6.0.2
        with:
          repository: leaseqa/client
          ref: main
          path: leaseqa-client

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: |
            leaseqa-server/package-lock.json
            leaseqa-client/package-lock.json

      - name: Install server dependencies
        working-directory: leaseqa-server
        run: npm ci

      - name: Install client dependencies
        working-directory: leaseqa-client
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: leaseqa-client/apps/web
        run: npx playwright install --with-deps chromium

      - name: Run client end-to-end tests against local server
        working-directory: leaseqa-client
        run: npm run e2e --workspace @leaseqa/web -- --retries=1
