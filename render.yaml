services:
  - type: web
    name: leaseqa-server
    env: node
    # --omit=dev keeps browser automation (playwright, used only by
    # scripts/check-corpus-upstream.js) out of the production web service.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
